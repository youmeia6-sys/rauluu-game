<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1731">
<title>ラウルゥのアイテムキャッチ！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#071225;color:white;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}
body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,760px);height:100dvh;overflow:hidden;background:#173b72}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.overlay{position:absolute;inset:0;z-index:30;background:linear-gradient(#08162ad9,#06101ee8);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.card{width:min(92%,470px);border-radius:26px;padding:22px;background:linear-gradient(160deg,#29457f,#16254b);border:1px solid #ffffff2a;text-align:center;box-shadow:0 24px 70px #0008}
.hero{width:170px;height:170px;object-fit:contain;border-radius:26px;background:#f5e7cf;border:3px solid #ffffff2d}
h1,h2{margin:8px 0}
p{line-height:1.55;color:#e4edff}
.item-legend{font-size:14px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item-legend div{background:#ffffff10;border-radius:12px;padding:9px}
button{border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#ffe16e,#ff9c57);color:#222}
.secondary{background:linear-gradient(135deg,#5fa7ff,#2f6fd1);color:white}
#hud{position:absolute;z-index:10;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1.35fr .9fr .9fr .9fr;gap:6px;pointer-events:none}
.hud{background:rgba(16,36,78,.9);border:1px solid #ffffff2d;border-radius:15px;padding:7px 8px;font-weight:900;text-align:center;box-shadow:0 5px 20px #0005}
.hud small{display:block;font-size:10px;opacity:.8}
.life{font-size:22px}
.xp{position:absolute;z-index:10;top:72px;left:14px;right:14px;height:8px;background:#ffffff24;border-radius:20px;overflow:hidden}
.xp>div{height:100%;width:0;background:linear-gradient(90deg,#64e0ff,#ffe66d,#ff9b76);transition:.2s}
.controls{position:absolute;z-index:12;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 38px;pointer-events:none}
.ctrl{width:82px;height:82px;border-radius:50%;border:2px solid #ffffff72;background:#233a64cc;color:white;font-size:46px;font-weight:900;display:grid;place-items:center;pointer-events:auto;user-select:none;touch-action:none;box-shadow:0 8px 25px #0006}
#pauseBtn{position:absolute;z-index:13;right:16px;bottom:118px;width:50px;height:50px;border-radius:15px;border:1px solid #ffffff55;background:#182a54e8;color:white;font-size:20px;font-weight:900}
#toast{position:absolute;z-index:16;left:50%;top:92px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#13275bea;font-weight:900;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bigemoji{font-size:46px}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud life" id="life">❤️❤️❤️</div>
  <div class="hud"><small>スコア</small><span id="score">0</span></div>
  <div class="hud"><small>タイム</small><span id="time">60</span></div>
  <div class="hud"><small>LEVEL</small><span id="lv">1</span></div>
</div>
<div class="xp"><div id="bar"></div></div>
<div id="toast"></div>
<button id="pauseBtn">Ⅱ</button>
<div class="controls"><div class="ctrl" id="left">‹</div><div class="ctrl" id="right">›</div></div>

function resize(){
  const r=c.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  player.y=H-150;if(!player.x)player.x=W/2;
  stars=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1}));
}
addEventListener('resize',resize);resize();
function ui(){ $('life').textContent='❤️'.repeat(Math.max(0,lives));$('score').textContent=score;$('time').textContent=Math.ceil(time);$('lv').textContent=level;$('bar').style.width=Math.min(100,(xp/need)*100)+'%';}
function reset(){playing=true;paused=false;score=0;lives=3;time=60;level=1;xp=0;need=320;spawnClock=0;items=[];parts=[];player.x=W/2;ui();}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,700)}
function addXP(n){xp+=n;if(xp>=need){xp-=need;level++;need=Math.round(need*1.35);paused=true;$('levelText').innerHTML=`ラウルゥが <b>Lv.${level}</b> にアップ！<br>落ちる速さが少しだけ上がるよ。`;$('levelup').classList.remove('hidden')}ui();}
function spawn(){const r=Math.random();let type=r<.48?'coin':r<.76?'diamond':r<.89?'ori':'cake';let size=type==='coin'?23:type==='diamond'?28:type==='ori'?30:25;const base=68+level*5;items.push({type,x:36+Math.random()*(W-72),y:-40,size,vy:base+Math.random()*28,rot:Math.random()*6.3,spin:(Math.random()-.5)*1.5});}
function burst(px,py,type){for(let i=0;i<10;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*120,vy:-25-Math.random()*80,life:1,type})}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2869a7');g.addColorStop(.66,'#165281');g.addColorStop(1,'#0b1830');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.32;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;ctx.fillStyle='#26303d';ctx.fillRect(0,H-76,W,76);ctx.strokeStyle='#58616d';for(let xx=0;xx<W;xx+=70){ctx.beginPath();ctx.moveTo(xx,H-76);ctx.lineTo(xx,H);ctx.stroke()}}
function drawPlayer(){const px=player.x-player.w/2,py=player.y-player.h/2;ctx.save();ctx.beginPath();ctx.roundRect(px,py,player.w,player.h,24);ctx.clip();if(rau.complete){ctx.drawImage(rau,0,0,rau.naturalWidth,rau.naturalHeight,px,py,player.w,player.h)}ctx.restore();ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(px,py,player.w,player.h,24);ctx.stroke();}
function drawDiamond(o){ctx.font=(o.size*2.05)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💎',0,0);}
function drawOri(o){const s=o.size;ctx.save();ctx.shadowColor='#1bbcff';ctx.shadowBlur=18;ctx.fillStyle='#1168d9';ctx.strokeStyle='#8fe8ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-s*.72,-s*.18);ctx.lineTo(-s*.28,-s);ctx.lineTo(s*.45,-s*.72);ctx.lineTo(s,-s*.05);ctx.lineTo(s*.56,s*.80);ctx.lineTo(-s*.20,s);ctx.lineTo(-s*.90,s*.34);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(190,245,255,.72)';ctx.beginPath();ctx.moveTo(-s*.38,-s*.30);ctx.lineTo(-s*.10,-s*.68);ctx.lineTo(s*.28,-s*.42);ctx.lineTo(s*.03,-s*.12);ctx.closePath();ctx.fill();ctx.restore();}
function drawItem(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);if(o.type==='coin'){ctx.fillStyle='#ffbf19';ctx.strokeStyle='#a96700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,o.size,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff1a1';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1)}else if(o.type==='diamond')drawDiamond(o);else if(o.type==='ori')drawOri(o);else{ctx.font=(o.size*1.8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍰',0,0)}ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);background();items.forEach(drawItem);drawPlayer();for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.type==='ori'?'#aef9ff':p.type==='diamond'?'#d8fbff':'#ffe481';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}ctx.globalAlpha=1;}
function hit(o){return Math.abs(o.x-player.x)<player.w*.46+o.size*.50&&Math.abs(o.y-player.y)<player.h*.43+o.size*.50}
function lose(){lives--;ui();toast('ぐぬぬ！ ライフ−1');if(lives<=0)finish()}
function collect(o){burst(o.x,o.y,o.type);if(o.type==='coin'){score+=10;addXP(10);toast('🪙 +10')}if(o.type==='diamond'){score+=50;addXP(50);toast('💎 ダイヤ +50！')}if(o.type==='ori'){score+=100;addXP(100);toast('🔵 オリハルコン +100！')}if(o.type==='cake'){time+=5;score+=20;addXP(20);toast('🍰 タイム +5秒！')}ui();}
function finish(){playing=false;paused=false;$('result').innerHTML=`スコア <b>${score}</b><br>到達レベル <b>Lv.${level}</b><br><br>${score>=1000?'みらくるゥ！✨':'もう一回いくのゥ！'}`;$('over').classList.remove('hidden')}
function home(){playing=false;paused=false;items=[];parts=[];$('over').classList.add('hidden');$('pause').classList.add('hidden');$('levelup').classList.add('hidden');$('start').classList.remove('hidden');draw();}
function loop(t){requestAnimationFrame(loop);if(!last)last=t;const dt=Math.min(.034,(t-last)/1000);last=t;if(!playing||paused){draw();return}time-=dt;if(time<=0){time=0;ui();finish();draw();return}let dir=(keys.right?1:0)-(keys.left?1:0);player.x+=dir*player.speed*dt;player.x=Math.max(player.w/2+8,Math.min(W-player.w/2-8,player.x));spawnClock+=dt;const interval=Math.max(.58,1.18-level*.045);if(spawnClock>=interval){spawnClock=0;spawn()}for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.vy*dt;o.rot+=o.spin*dt;if(hit(o)){collect(o);items.splice(i,1);continue}if(o.y>H-70){if(o.type!=='cake')lose();items.splice(i,1)}}for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt*1.7}parts=parts.filter(p=>p.life>0);ui();draw();}
function hold(el,key){const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false})}
hold($('left'),'left');hold($('right'),'right');
$('startBtn').onclick=()=>{$('start').classList.add('hidden');reset()};
$('againBtn').onclick=()=>{$('over').classList.add('hidden');reset()};
$('homeBtn').onclick=home;
$('continueBtn').onclick=()=>{$('levelup').classList.add('hidden');paused=false};
$('pauseBtn').onclick=()=>{if(!playing)return;paused=true;$('pause').classList.remove('hidden')};
$('resumeBtn').onclick=()=>{$('pause').classList.add('hidden');paused=false};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
requestAnimationFrame(loop);
</script>
